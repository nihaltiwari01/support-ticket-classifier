<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Ticket Classifier</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; color: #222; }
    .wrap { max-width: 760px; margin: auto; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
    textarea { width: 100%; height: 80px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { margin-top: 10px; padding: 8px 16px; border: none; background: #2563eb; color: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 6px; margin-left: 8px; }
    .stats { display: flex; gap: 12px; }
    .stat { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    .stat b { font-size: 24px; display: block; }
    .bar { height: 8px; background: #2563eb; border-radius: 4px; margin: 2px 0 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { text-align: left; padding: 6px 4px; border-top: 1px solid #eee; }
    .error { color: #b91c1c; margin-top: 8px; }
    .explain { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eee; font-size: 14px; }
    .explain h4 { margin: 0 0 8px; font-size: 14px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .row .name { width: 110px; }
    .row .track { flex: 1; background: #eef2f7; border-radius: 4px; height: 8px; }
    .row .fill { background: #2563eb; height: 8px; border-radius: 4px; }
    .row .pct { width: 48px; text-align: right; color: #555; }
    .chip { display: inline-block; background: #e8f5e9; color: #1b5e20; border-radius: 6px; padding: 2px 10px; margin: 2px 6px 2px 0; }
    .note { color: #555; margin: 6px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <h2>Support Ticket Classifier</h2>

  <div class="card">
    <p>Paste a customer message</p>
    <textarea id="message" placeholder="I was charged twice for my subscription"></textarea>
    <button onclick="classify()">Classify ticket</button>
    <div id="result" style="margin-top:10px;"></div>
  </div>

  <div class="stats" style="margin-bottom:16px;">
    <div class="stat">Total tickets<b id="total">0</b></div>
    <div class="stat">Model accuracy<b id="accuracy">-</b></div>
  </div>

  <div class="card"><p>Tickets by category</p><div id="counts"></div></div>

  <div class="card">
    <p>Recent tickets</p>
    <table><thead><tr><th>Message</th><th>Category</th><th>Confidence</th></tr></thead><tbody id="recent"></tbody></table>
  </div>
</div>

<script>
async function classify() {
  const message = document.getElementById("message").value;
  const result = document.getElementById("result");
  const res = await fetch("/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  });
  const data = await res.json();
  if (!res.ok) { result.innerHTML = '<div class="error">' + data.error + '</div>'; return; }
  result.innerHTML = 'Result <span class="badge">' + esc(data.category) + '</span> confidence ' + data.confidence + '%' + explainHtml(data);
  loadStats();
}

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function explainHtml(d) {
  let h = '<div class="explain"><h4>How the model decided</h4>';
  if (d.category === "Needs review") {
    h += '<p class="note">The best guess was <b>' + esc(d.best_guess) + '</b>, but confidence is under 50%, so a human should review this ticket.</p>';
  }
  h += '<p class="note">Top guesses:</p>';
  h += d.top.map(t =>
    '<div class="row"><span class="name">' + esc(t.category) + '</span><div class="track"><div class="fill" style="width:' + t.probability + '%"></div></div><span class="pct">' + t.probability + '%</span></div>'
  ).join("");
  if (d.recognised_words === 0) {
    h += '<p class="note">The model did not recognise any word in this message, so it could only guess.</p>';
  } else if (d.helpful_words.length > 0) {
    h += '<p class="note">Words that pushed it toward <b>' + esc(d.best_guess) + '</b>:</p>';
    h += d.helpful_words.map(w => '<span class="chip">' + esc(w.word) + '</span>').join("");
  }
  return h + '</div>';
}

async function loadStats() {
  const data = await (await fetch("/stats")).json();
  document.getElementById("total").textContent = data.total;
  document.getElementById("accuracy").textContent = data.accuracy + "%";

  const max = Math.max(1, ...data.counts.map(c => c.total));
  document.getElementById("counts").innerHTML = data.counts.map(c =>
    '<div>' + c.category + ' (' + c.total + ')</div><div class="bar" style="width:' + (c.total / max * 100) + '%"></div>'
  ).join("");

  document.getElementById("recent").innerHTML = data.recent.map(r =>
    '<tr><td>' + r.message.replace(/</g, "&lt;") + '</td><td>' + r.category + '</td><td>' + r.confidence + '%</td></tr>'
  ).join("");
}
loadStats();
</script>
</body>
</html>
